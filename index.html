<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinesh Ram's Science Corner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #060c1f;
    --cream-deep: #0a1738;
    --panel: #0d1b3f;
    --panel-2: #10224e;
    --ink: #eaf2ff;
    --muted: #93a8d1;
    --teal: #35c7ff;
    --teal-dark: #bdeeff;
    --teal-tint: rgba(53,199,255,0.16);
    --orange: #6a5cd8;
    --green: #35d999;
    --red: #ff6b6b;
    --yellow: #ffe066;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; overflow-x: hidden; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--cream);
    background-image:
      radial-gradient(1.5px 1.5px at 8% 12%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 22% 68%, #fff, transparent),
      radial-gradient(1px 1px at 38% 24%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 54% 82%, #fff, transparent),
      radial-gradient(1px 1px at 66% 14%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 78% 58%, #fff, transparent),
      radial-gradient(1px 1px at 91% 32%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 12% 90%, #fff, transparent),
      radial-gradient(1px 1px at 47% 46%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 85% 88%, #fff, transparent),
      radial-gradient(900px 500px at 10% 5%, rgba(53,199,255,0.10), transparent 60%),
      radial-gradient(800px 450px at 90% 90%, rgba(106,92,216,0.12), transparent 60%);
    background-repeat: repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, no-repeat, no-repeat;
    background-size: 100% 1400px, 100% 1400px, 100% 1400px, 100% 1400px, 100% 1400px, 100% 1400px, 100% 1400px, 100% 1400px, 100% 1400px, 100% 1400px, auto, auto;
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
  }
  h1, h2, h3 { font-family: "Fredoka", sans-serif; font-weight: 600; margin: 0; }
  em {
    font-style: normal; color: var(--teal); font-family: "Fredoka", sans-serif; font-weight: 600;
    text-decoration: underline; text-decoration-style: wavy; text-decoration-color: var(--yellow);
    text-underline-offset: 4px;
  }

  /* Space decorations */
  .bg-decor { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .bg-decor img {
    position: absolute; opacity: 0.85; filter: drop-shadow(0 0 18px rgba(53,199,255,0.15));
  }
  .bg-decor .atom { top: -20px; left: -30px; width: 220px; animation: floaty 7s ease-in-out infinite; }
  .bg-decor .planet { top: 480px; right: -20px; width: 220px; animation: floaty 8s ease-in-out infinite 1s; }
  .bg-decor .flask { top: 620px; left: -10px; width: 150px; animation: floaty 6.5s ease-in-out infinite 0.3s; }
  .bg-decor .microscope { top: 1050px; right: 2%; width: 170px; animation: floaty 7.5s ease-in-out infinite 0.8s; }
  .bg-decor .test-tubes { top: 1250px; right: -20px; width: 220px; animation: floaty 6s ease-in-out infinite 1.4s; }
  .bg-decor .molecule { top: 950px; left: -20px; width: 200px; opacity: 0.4; animation: floaty 9s ease-in-out infinite; }
  @media (max-width: 900px) { .bg-decor { display: none; } }
  header.site, main { position: relative; z-index: 1; }

  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(8deg); }
  }

  /* Header */
  header.site {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.7rem;
    padding: 1.75rem 2rem 1.5rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    max-width: 1080px;
    margin: 0 auto;
  }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; }
  .avatar-ring { position: relative; display: inline-block; }
  .avatar-ring::before {
    content: ''; position: absolute; inset: -16px; border-radius: 50%;
    border: 1px dashed rgba(53,199,255,0.55);
    animation: spin 14s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .brand .mark {
    width: 144px; height: 144px; border-radius: 50%;
    display: block; object-fit: cover; object-position: center 25%;
    border: 4px solid var(--teal);
    box-shadow: 0 0 30px rgba(53,199,255,0.4);
  }
  .brand .word { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.15rem; }

  main { max-width: 700px; margin: 0 auto; padding: 2.5rem 2rem 4rem; }
  @media (max-width: 720px) { main { padding: 1.75rem 1.25rem 3rem; } header.site { padding: 1.1rem 1.25rem; } }

  section.page-section { margin-bottom: 3.5rem; }
  .eyebrow {
    text-align: center; text-transform: uppercase; letter-spacing: 0.12em;
    font-size: 0.78rem; font-weight: 600; color: var(--teal);
  }
  .page-title {
    text-align: center; font-size: clamp(1.8rem, 5.5vw, 2.4rem); line-height: 1.2;
    margin: 0.6rem auto 0;
  }
  .page-sub {
    text-align: center; color: var(--muted); font-size: 1.02rem;
    max-width: 32rem; margin: 0.9rem auto 0;
  }

  /* App card */
  .card {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 1.9rem;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    margin: 2rem auto 0;
    max-width: 560px;
  }

  .stats { display: flex; justify-content: center; gap: 1.7rem; margin-bottom: 1.1rem; font-size: 0.92rem; color: var(--muted); }
  .stats b { color: var(--teal-dark); font-size: 1.15rem; font-family: "Fredoka", sans-serif; }

  button.primary {
    border: none; padding: 0.7rem 1.4rem; border-radius: 999px;
    font-size: 1.05rem; font-weight: 700; color: #fff; background: var(--teal); cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  button.primary:hover { background: #1c86b8; transform: scale(1.05); }
  button.primary:active { transform: scale(0.95); }

  .question { font-size: 1.2rem; font-weight: 600; margin-bottom: 1.25rem; text-align: center; }
  .options { display: grid; gap: 0.7rem; }
  .opt {
    text-align: left; padding: 0.8rem 1rem; border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.14); background: var(--panel-2);
    font-size: 1rem; cursor: pointer; font-family: inherit; color: var(--ink);
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .opt:hover:not([disabled]) { border-color: var(--teal); transform: translateX(3px); }
  .opt.correct { background: rgba(53,217,153,0.16); border-color: var(--green); animation: pop 0.3s ease; }
  .opt.wrong { background: rgba(255,107,107,0.16); border-color: var(--red); }
  .opt[disabled] { cursor: default; }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }

  .next-row { text-align: center; margin-top: 1.25rem; }
  .topic-tag {
    display: inline-block; font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--teal-dark); background: var(--teal-tint);
    padding: 0.2rem 0.7rem; border-radius: 999px; margin-bottom: 0.9rem;
  }
  .star-rating { text-align: center; font-size: 2rem; margin: 0.6rem 0; letter-spacing: 0.2rem; }
  .confetti-piece {
    position: fixed; top: 40%; font-size: 1.4rem; pointer-events: none; z-index: 20;
    animation: confetti-burst 0.9s ease-out forwards;
  }
  @keyframes confetti-burst {
    0% { transform: translate(0, 0) rotate(0deg) scale(0.6); opacity: 1; }
    100% { transform: var(--end, translate(0, -120px)) rotate(360deg) scale(1); opacity: 0; }
  }

  /* Build-the-Car drag-and-drop game */
  .car-track { position: relative; width: 100%; max-width: 320px; height: 110px; margin: 1.5rem auto 0; overflow: visible; }
  .car-stage { position: absolute; left: 50%; bottom: 0; width: 220px; height: 100px; transform: translateX(-50%); }
  .car-stage.racing { animation: race 1.3s cubic-bezier(.5,-0.2,.6,1) forwards; }
  @keyframes race {
    0% { transform: translateX(-50%); }
    100% { transform: translateX(calc(-50% + 500px)); opacity: 0; }
  }
  .car-road { position: absolute; bottom: -2px; left: 0; right: 0; height: 3px; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.3) 0 14px, transparent 14px 26px); }

  .drop-zone {
    position: absolute; border: 2px dashed rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.04); transition: opacity 0.3s ease, border-color 0.2s ease;
  }
  .drop-zone.filled { opacity: 0; }
  .drop-zone.flash { border-color: var(--red); background: rgba(255,107,107,0.15); }
  .dz-chassis { bottom: 22px; left: 10px; width: 180px; height: 34px; border-radius: 10px 10px 4px 4px; }
  .dz-cabin { bottom: 50px; left: 55px; width: 90px; height: 32px; border-radius: 16px 16px 0 0; }
  .dz-wheel-l { bottom: -4px; left: 20px; width: 50px; height: 50px; border-radius: 50%; }
  .dz-wheel-r { bottom: -4px; left: 140px; width: 50px; height: 50px; border-radius: 50%; }
  .dz-light { bottom: 26px; left: 160px; width: 26px; height: 26px; border-radius: 50%; }

  .car-part { position: absolute; opacity: 0; transform: scale(0.4); transition: opacity 0.35s ease, transform 0.35s cubic-bezier(.34,1.56,.64,1); }
  .car-part.visible { opacity: 1; transform: scale(1); }
  .car-chassis { bottom: 22px; left: 10px; width: 180px; height: 34px; background: var(--teal); border-radius: 10px 10px 4px 4px; }
  .car-cabin { bottom: 50px; left: 55px; width: 90px; height: 32px; background: var(--orange); border-radius: 16px 16px 0 0; }
  .car-wheel-l, .car-wheel-r { bottom: 4px; width: 34px; height: 34px; background: #0d1424; border: 4px solid #6b7a9c; border-radius: 50%; }
  .car-wheel-l { left: 28px; }
  .car-wheel-r { left: 148px; }
  .car-light { bottom: 34px; left: 172px; width: 10px; height: 10px; background: var(--yellow); border-radius: 50%; box-shadow: 0 0 10px var(--yellow); }

  .parts-tray {
    display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center;
    margin-top: 1.6rem; min-height: 3rem;
  }
  .chip {
    padding: 0.6rem 1.1rem; border-radius: 12px;
    background: var(--panel-2); border: 2px solid rgba(255,255,255,0.16);
    color: var(--ink); font-family: inherit; font-size: 0.95rem; font-weight: 600;
    cursor: grab; touch-action: none; user-select: none;
  }
  .chip:active { cursor: grabbing; }
  .chip.dragging { visibility: hidden; }
  .chip-ghost {
    position: fixed; z-index: 200; pointer-events: none;
    padding: 0.6rem 1.1rem; border-radius: 12px;
    background: var(--teal); color: #06182f; font-family: inherit; font-size: 0.95rem; font-weight: 700;
    box-shadow: 0 10px 24px rgba(0,0,0,0.4);
    transform: translate(-50%, -50%) scale(1.05);
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .chip.shake { animation: shake 0.3s ease; }
  .car-msg { text-align: center; min-height: 1.4rem; margin-top: 1rem; font-weight: 600; }
  .car-msg.wrong { color: var(--red); }
  .car-msg.correct { color: var(--green); }
</style>
</head>
<body>

<div class="bg-decor">
  <img class="atom" src="assets/atom.svg" alt="">
  <img class="planet" src="assets/planet.svg" alt="">

<main>

  <section class="page-section" id="carSection">

    <div class="card">

        <div>Question <b id="qNum">1</b>/<span id="qTotal">10</span></div>
        <div>Score <b id="qScore">0</b></div>
        <div>Best <b id="qBest">0</b></div>
      </div>
      <div class="topic-tag" id="qTopic">Science</div>
      <div class="question" id="qQuestion">Loading...</div>
      <div class="options" id="qOptions"></div>
      <div class="next-row">
        <button class="primary" id="qNext" style="display:none;">Next Question →</button>
      </div>

<script>
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function confettiBurst(x, y) {
  const emojis = ['🎉', '⭐', '✨', '🚀', '🌟'];
  for (let i = 0; i < 8; i++) {
    const piece = document.createElement('span');
    piece.className = 'confetti-piece';
    piece.textContent = emojis[rand(0, emojis.length - 1)];
    piece.style.left = x + 'px';
    piece.style.top = y + 'px';
    const dx = rand(-80, 80), dy = rand(-140, -60);
    piece.style.setProperty('--end', `translate(${dx}px, ${dy}px)`);
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 950);
  }
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = rand(0, i);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- Build-the-Car drag-and-drop game ----------
const carParts = [
  { label: 'Wheels', part: 'wheels' },
  { label: 'Chassis', part: 'chassis' },
  { label: 'Roof', part: 'cabin' },
  { label: 'Headlights', part: 'light' },
];
const carDecoys = ['Wings', 'Hull', 'Propeller'];

const carStage = document.getElementById('carStage');
const partsTray = document.getElementById('partsTray');
const carMsgEl = document.getElementById('carMsg');
const carResetBtn = document.getElementById('carReset');
let filledParts = new Set();

function buildTray() {
  const chips = shuffle([
    ...carParts.map(p => ({ label: p.label, part: p.part, real: true })),
    ...carDecoys.map(label => ({ label, part: null, real: false })),
  ]);
  partsTray.innerHTML = '';
  chips.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = c.label;
    chip.dataset.part = c.part || '';
    attachDrag(chip);
    partsTray.appendChild(chip);
  });
}

function startCarGame() {
  filledParts = new Set();
  carStage.classList.remove('racing');
  carStage.querySelectorAll('.car-part').forEach(p => p.classList.remove('visible'));
  carStage.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('filled'));
  carMsgEl.textContent = '';
  carMsgEl.className = 'car-msg';
  carResetBtn.style.display = 'none';
  buildTray();
}

function attachDrag(chip) {
  chip.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const rect = chip.getBoundingClientRect();
    const ghost = document.createElement('div');
    ghost.className = 'chip-ghost';
    ghost.textContent = chip.textContent;
    ghost.style.left = e.clientX + 'px';
    ghost.style.top = e.clientY + 'px';
    document.body.appendChild(ghost);
    chip.classList.add('dragging');

    function onMove(ev) {
      ghost.style.left = ev.clientX + 'px';
      ghost.style.top = ev.clientY + 'px';
    }
    function onUp(ev) {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      ghost.remove();
      const target = document.elementFromPoint(ev.clientX, ev.clientY);
      const zone = target ? target.closest('.drop-zone') : null;
      if (zone && !zone.classList.contains('filled') && chip.dataset.part && zone.dataset.part === chip.dataset.part) {
        zone.classList.add('filled');
        carStage.querySelectorAll(`.car-part[data-part="${chip.dataset.part}"]`).forEach(p => p.classList.add('visible'));
        filledParts.add(chip.dataset.part);
        confettiBurst(ev.clientX, ev.clientY);
        carMsgEl.textContent = 'Nice fit!';
        carMsgEl.className = 'car-msg correct';
        chip.remove();
        if (filledParts.size >= carParts.length) {
          setTimeout(() => {
            carMsgEl.textContent = 'Ready, set... GO! 🏁';
            carStage.classList.add('racing');
            carResetBtn.style.display = 'inline-block';
          }, 400);
        }
      } else {
        chip.classList.remove('dragging');
        chip.classList.add('shake');
        setTimeout(() => chip.classList.remove('shake'), 300);
        if (zone) {
          carMsgEl.textContent = "That part doesn't go there — try another spot!";
          carMsgEl.className = 'car-msg wrong';
        }
      }
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}

carResetBtn.addEventListener('click', startCarGame);
startCarGame();

// ---------- Science Questions quiz ----------
const scienceBank = [

  { topic: 'Chemistry', q: 'What gas do humans breathe in to survive?', options: ['Carbon dioxide', 'Nitrogen', 'Oxygen', 'Helium'], a: 2 },
  { topic: 'Chemistry', q: 'What state of matter is ice?', options: ['Gas', 'Liquid', 'Solid', 'Plasma'], a: 2 },
  { topic: 'Chemistry', q: 'What is the boiling point of water in Celsius?', options: ['50', '90', '100', '150'], a: 2 },
  { topic: 'Chemistry', q: 'What is the center of an atom called?', options: ['Electron', 'Nucleus', 'Proton', 'Orbit'], a: 1 },
  { topic: 'Biology', q: 'What gas do plants absorb from the air to make food?', options: ['Oxygen', 'Carbon dioxide', 'Nitrogen', 'Hydrogen'], a: 1 },
  { topic: 'Biology', q: 'What do bees make?', options: ['Milk', 'Honey', 'Silk', 'Wax only'], a: 1 },
  { topic: 'Biology', q: 'What do caterpillars turn into?', options: ['Bees', 'Butterflies', 'Moths only', 'Beetles'], a: 1 },
  { topic: 'Biology', q: 'What do we call animals that only eat plants?', options: ['Carnivores', 'Omnivores', 'Herbivores', 'Predators'], a: 2 },
  { topic: 'Biology', q: 'What is the study of living things called?', options: ['Physics', 'Chemistry', 'Biology', 'Geology'], a: 2 },
  { topic: 'Physics', q: 'How many legs does a spider have?', options: ['6', '8', '10', '4'], a: 1 },
  { topic: 'Physics', q: 'What force pulls objects toward Earth?', options: ['Magnetism', 'Gravity', 'Friction', 'Tension'], a: 1 },
  { topic: 'Nature', q: 'Which bird cannot fly?', options: ['Sparrow', 'Ostrich', 'Eagle', 'Pigeon'], a: 1 },
  { topic: 'Nature', q: 'Which is the fastest land animal?', options: ['Lion', 'Horse', 'Cheetah', 'Leopard'], a: 2 },
];

const QUIZ_LEN = 10;
let qQuestions = [], qIndex = 0, qScore = 0;
const qQuestionEl = document.getElementById('qQuestion');
const qOptionsEl = document.getElementById('qOptions');
const qTopicEl = document.getElementById('qTopic');
const qNumEl = document.getElementById('qNum');
const qTotalEl = document.getElementById('qTotal');
const qScoreEl = document.getElementById('qScore');
const qBestEl = document.getElementById('qBest');
const qNextBtn = document.getElementById('qNext');
let qBest = Number(localStorage.getItem('dr_science_best') || 0);
qBestEl.textContent = qBest;
qTotalEl.textContent = QUIZ_LEN;

function startQuiz() {
  qQuestions = shuffle(scienceBank).slice(0, QUIZ_LEN);
  qIndex = 0;
  qScore = 0;
  qScoreEl.textContent = qScore;
  renderQuiz();
}

function renderQuiz() {
  if (qIndex >= qQuestions.length) {
    qTopicEl.textContent = 'Done';
    const pct = qScore / qQuestions.length;
    const starCount = pct >= 0.9 ? 3 : pct >= 0.6 ? 2 : 1;
    const stars = '⭐'.repeat(starCount) + '☆'.repeat(3 - starCount);
    qQuestionEl.innerHTML = `Quiz complete! 🎉<br>You scored <b>${qScore}/${qQuestions.length}</b>`;
    qOptionsEl.innerHTML = `<div class="star-rating">${stars}</div>`;
    if (qScore > qBest) {
      qBest = qScore;
      localStorage.setItem('dr_science_best', qBest);
      qBestEl.textContent = qBest;
    }
    qNextBtn.textContent = 'Play Again';
    qNextBtn.style.display = 'inline-block';
    qNextBtn.onclick = startQuiz;
    return;
  }
  const item = qQuestions[qIndex];
  qNumEl.textContent = qIndex + 1;
  qTopicEl.textContent = item.topic;
  qQuestionEl.textContent = item.q;
  qOptionsEl.innerHTML = '';
  qNextBtn.style.display = 'none';

  item.options.forEach((optText, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = optText;
    btn.addEventListener('click', () => selectQuiz(i, item));
    qOptionsEl.appendChild(btn);
  });
}

function selectQuiz(choice, item) {
  const btns = qOptionsEl.querySelectorAll('.opt');
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === item.a) b.classList.add('correct');
    else if (i === choice) b.classList.add('wrong');
  });
  if (choice === item.a) {
    qScore++;
    const rect = btns[choice].getBoundingClientRect();
    confettiBurst(rect.left + rect.width / 2, rect.top);
  }
  qScoreEl.textContent = qScore;
  qNextBtn.textContent = 'Next Question →';
  qNextBtn.style.display = 'inline-block';
  qNextBtn.onclick = () => { qIndex++; renderQuiz(); };
}

startQuiz();
</script>
</body>
</html>
