<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinesh Ram's Science Corner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #060c1f;
    --cream-deep: #0a1738;
    --panel: #0d1b3f;
    --panel-2: #10224e;
    --ink: #eaf2ff;
    --muted: #93a8d1;
    --teal: #35c7ff;
    --teal-dark: #bdeeff;
    --teal-tint: rgba(53,199,255,0.16);
    --orange: #6a5cd8;
    --green: #35d999;
    --red: #ff6b6b;
    --yellow: #ffe066;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; overflow-x: hidden; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--cream);
    background-image:
      radial-gradient(1.5px 1.5px at 8% 12%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 22% 68%, #fff, transparent),
      radial-gradient(1px 1px at 38% 24%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 54% 82%, #fff, transparent),
      radial-gradient(1px 1px at 66% 14%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 78% 58%, #fff, transparent),
      radial-gradient(1px 1px at 91% 32%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 12% 90%, #fff, transparent),
      radial-gradient(1px 1px at 47% 46%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 85% 88%, #fff, transparent),
      radial-gradient(900px 500px at 10% 5%, rgba(53,199,255,0.10), transparent 60%),
      radial-gradient(800px 450px at 90% 90%, rgba(106,92,216,0.12), transparent 60%);
    background-repeat: repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, no-repeat, no-repeat;
    background-size: 100% 1400px, 100% 1400px, 100% 1400px, 100% 1400px, 100% 1400px, 100% 1400px, 100% 1400px, 100% 1400px, 100% 1400px, 100% 1400px, auto, auto;
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
  }
  h1, h2, h3 { font-family: "Fredoka", sans-serif; font-weight: 600; margin: 0; }
  em {
    font-style: normal; color: var(--teal); font-family: "Fredoka", sans-serif; font-weight: 600;
    text-decoration: underline; text-decoration-style: wavy; text-decoration-color: var(--yellow);
    text-underline-offset: 4px;
  }

  /* Space decorations */
  .bg-decor { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .bg-decor img {
    position: absolute; opacity: 0.85; filter: drop-shadow(0 0 18px rgba(53,199,255,0.15));
  }
  .bg-decor .atom { top: -20px; left: -30px; width: 220px; animation: floaty 7s ease-in-out infinite; }
  .bg-decor .planet { top: 480px; right: -20px; width: 220px; animation: floaty 8s ease-in-out infinite 1s; }
  .bg-decor .flask { top: 620px; left: -10px; width: 150px; animation: floaty 6.5s ease-in-out infinite 0.3s; }
  .bg-decor .microscope { top: 1000px; right: 2%; width: 170px; animation: floaty 7.5s ease-in-out infinite 0.8s; }
  .bg-decor .test-tubes { top: 1180px; right: -20px; width: 220px; animation: floaty 6s ease-in-out infinite 1.4s; }
  .bg-decor .molecule { top: 900px; left: -20px; width: 200px; opacity: 0.4; animation: floaty 9s ease-in-out infinite; }
  @media (max-width: 900px) { .bg-decor { display: none; } }
  header.site, main { position: relative; z-index: 1; }

  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(8deg); }
  }

  /* Header */
  header.site {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.7rem;
    padding: 1.75rem 2rem 1.5rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    max-width: 1080px;
    margin: 0 auto;
  }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; }
  .avatar-ring { position: relative; display: inline-block; }
  .avatar-ring::before {
    content: ''; position: absolute; inset: -16px; border-radius: 50%;
    border: 1px dashed rgba(53,199,255,0.55);
    animation: spin 14s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .brand .mark {
    width: 144px; height: 144px; border-radius: 50%;
    display: block; object-fit: cover; object-position: center 25%;
    border: 4px solid var(--teal);
    box-shadow: 0 0 30px rgba(53,199,255,0.4);
  }
  .brand .word { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 1.15rem; }
  .replay-btn {
    border: none; background: none; color: var(--muted); font-size: 0.85rem;
    cursor: pointer; text-decoration: underline; font-family: inherit;
  }
  .replay-btn:hover { color: var(--teal); }

  main { max-width: 700px; margin: 0 auto; padding: 2.5rem 2rem 4rem; }
  @media (max-width: 720px) { main { padding: 1.75rem 1.25rem 3rem; } header.site { padding: 1.1rem 1.25rem; } }

  .eyebrow {
    text-align: center; text-transform: uppercase; letter-spacing: 0.12em;
    font-size: 0.78rem; font-weight: 600; color: var(--teal);
  }
  .page-title {
    text-align: center; font-size: clamp(1.8rem, 5.5vw, 2.6rem); line-height: 1.2;
    margin: 0.6rem auto 0;
  }
  .page-sub {
    text-align: center; color: var(--muted); font-size: 1.02rem;
    max-width: 32rem; margin: 0.9rem auto 0;
  }

  .doodle {
    position: absolute; width: 24px; opacity: 0.9;
    animation: floaty 4s ease-in-out infinite;
    pointer-events: none; user-select: none;
  }
  .doodle.d1 { top: -6px; left: 6%; }
  .doodle.d2 { top: 8px; right: 8%; width: 18px; animation-delay: 0.6s; }
  .doodle.d3 { bottom: -10px; left: 22%; width: 16px; animation-delay: 1.2s; }
  @media (max-width: 640px) { .doodle { display: none; } }

  /* App card */
  .card {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 1.9rem;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    margin: 2rem auto 0;
    max-width: 560px;
  }

  .stats { display: flex; justify-content: center; gap: 1.7rem; margin-bottom: 1.1rem; font-size: 0.92rem; color: var(--muted); }
  .stats b { color: var(--teal-dark); font-size: 1.15rem; font-family: "Fredoka", sans-serif; }

  button.primary {
    border: none; padding: 0.7rem 1.4rem; border-radius: 999px;
    font-size: 1.05rem; font-weight: 700; color: #fff; background: var(--teal); cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  button.primary:hover { background: #1c86b8; transform: scale(1.05); }
  button.primary:active { transform: scale(0.95); }

  .question { font-size: 1.2rem; font-weight: 600; margin-bottom: 1.25rem; text-align: center; }
  .options { display: grid; gap: 0.7rem; }
  .opt {
    text-align: left; padding: 0.8rem 1rem; border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.14); background: var(--panel-2);
    font-size: 1rem; cursor: pointer; font-family: inherit; color: var(--ink);
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .opt:hover:not([disabled]) { border-color: var(--teal); transform: translateX(3px); }
  .opt.correct { background: rgba(53,217,153,0.16); border-color: var(--green); animation: pop 0.3s ease; }
  .opt.wrong { background: rgba(255,107,107,0.16); border-color: var(--red); }
  .opt[disabled] { cursor: default; }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }

  .next-row { text-align: center; margin-top: 1.25rem; }
  .topic-tag {
    display: inline-block; font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--teal-dark); background: var(--teal-tint);
    padding: 0.2rem 0.7rem; border-radius: 999px; margin-bottom: 0.9rem;
  }
  .star-rating { text-align: center; font-size: 2rem; margin: 0.6rem 0; letter-spacing: 0.2rem; }
  .confetti-piece {
    position: fixed; top: 40%; font-size: 1.4rem; pointer-events: none; z-index: 20;
    animation: confetti-burst 0.9s ease-out forwards;
  }
  @keyframes confetti-burst {
    0% { transform: translate(0, 0) rotate(0deg) scale(0.6); opacity: 1; }
    100% { transform: var(--end, translate(0, -120px)) rotate(360deg) scale(1); opacity: 0; }
  }

  /* Entry mission (game) */
  .mission {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem 1.5rem; text-align: center;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .mission.unlocked { opacity: 0; visibility: hidden; pointer-events: none; }
  .mission-hero { position: relative; margin-bottom: 0.5rem; }
  .mission-rocket { width: 100px; animation: floaty 3s ease-in-out infinite; }
  .mission-rocket.launch { animation: launch 1s ease-in forwards; }
  @keyframes launch {
    to { transform: translateY(-140vh) rotate(-10deg); opacity: 0; }
  }
  .mission-progress { display: flex; gap: 0.6rem; justify-content: center; margin: 1.1rem 0 0.4rem; }
  .mission-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25); transition: all 0.3s ease;
  }
  .mission-dot.current { border-color: var(--teal); }
  .mission-dot.done { background: var(--teal); border-color: var(--teal); box-shadow: 0 0 10px rgba(53,199,255,0.6); }
  .mission-msg { min-height: 1.4rem; margin-top: 1rem; font-weight: 600; }
  .mission-msg.wrong { color: var(--red); }
  .mission-msg.correct { color: var(--green); }
</style>
</head>
<body>

<div id="entryMission" class="mission">
  <div class="mission-hero">
    <img class="doodle d1" src="assets/star.svg" alt="">
    <img class="doodle d2" src="assets/star.svg" alt="">
    <img id="missionRocket" class="mission-rocket" src="assets/rocket.svg" alt="">
  </div>
  <div class="eyebrow">Mission Control</div>
  <h1 class="page-title">Science <em>Challenge</em></h1>
  <p class="page-sub">Answer 3 questions correctly to launch into the Science Zone!</p>
  <div class="mission-progress">
    <span class="mission-dot" id="mDot0"></span>
    <span class="mission-dot" id="mDot1"></span>
    <span class="mission-dot" id="mDot2"></span>
  </div>
  <div class="card">
    <div class="question" id="missionQ">Loading...</div>
    <div class="options" id="missionOptions"></div>
    <p class="mission-msg" id="missionMsg"></p>
  </div>
</div>

<div class="bg-decor">
  <img class="atom" src="assets/atom.svg" alt="">
  <img class="planet" src="assets/planet.svg" alt="">
  <img class="flask" src="assets/flask.svg" alt="">
  <img class="microscope" src="assets/microscope.svg" alt="">
  <img class="test-tubes" src="assets/test_tubes.svg" alt="">
  <img class="molecule" src="assets/molecule.svg" alt="">
</div>

<header class="site">
  <div class="brand">
    <span class="word">Dinesh Ram's Science Corner</span>
    <span class="avatar-ring">
      <img class="mark" src="dinesh-avatar.png" alt="Dinesh Ram">
    </span>
  </div>
  <button id="replayBtn" class="replay-btn">🔁 Replay Mission Challenge</button>
</header>

<main>
  <div class="eyebrow">Science Zone</div>
  <h1 class="page-title">Science Questions</h1>
  <p class="page-sub">Explore fun facts about space, the human body, chemistry and more!</p>

  <div class="card">
    <div class="stats">
      <div>Question <b id="qNum">1</b>/<span id="qTotal">10</span></div>
      <div>Score <b id="qScore">0</b></div>
      <div>Best <b id="qBest">0</b></div>
    </div>
    <div class="topic-tag" id="qTopic">Science</div>
    <div class="question" id="qQuestion">Loading...</div>
    <div class="options" id="qOptions"></div>
    <div class="next-row">
      <button class="primary" id="qNext" style="display:none;">Next Question →</button>
    </div>
  </div>
</main>

<script>
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function confettiBurst(x, y) {
  const emojis = ['🎉', '⭐', '✨', '🚀', '🌟'];
  for (let i = 0; i < 8; i++) {
    const piece = document.createElement('span');
    piece.className = 'confetti-piece';
    piece.textContent = emojis[rand(0, emojis.length - 1)];
    piece.style.left = x + 'px';
    piece.style.top = y + 'px';
    const dx = rand(-80, 80), dy = rand(-140, -60);
    piece.style.setProperty('--end', `translate(${dx}px, ${dy}px)`);
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 950);
  }
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = rand(0, i);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- Entry mission (3-question game) ----------
const missionBank = [
  { q: 'Which planet is known as the Red Planet?', options: ['Venus', 'Mars', 'Jupiter', 'Saturn'], a: 1 },
  { q: 'What gas do humans breathe in to survive?', options: ['Carbon dioxide', 'Nitrogen', 'Oxygen', 'Helium'], a: 2 },
  { q: 'How many legs does a spider have?', options: ['6', '8', '10', '4'], a: 1 },
  { q: 'What is the closest star to Earth?', options: ['Proxima Centauri', 'Polaris', 'Sirius', 'The Sun'], a: 3 },
  { q: 'What state of matter is ice?', options: ['Gas', 'Liquid', 'Solid', 'Plasma'], a: 2 },
  { q: 'Which planet is famous for its rings?', options: ['Saturn', 'Mercury', 'Earth', 'Mars'], a: 0 },
  { q: 'What do we call animals that only eat plants?', options: ['Carnivores', 'Omnivores', 'Herbivores', 'Predators'], a: 2 },
  { q: 'How many bones does an adult human body have?', options: ['126', '160', '206', '260'], a: 2 },
];

const MISSION_LEN = 3;
let missionQuestions = [];
let missionIndex = 0;
const missionQEl = document.getElementById('missionQ');
const missionOptsEl = document.getElementById('missionOptions');
const missionMsgEl = document.getElementById('missionMsg');
const missionDots = [document.getElementById('mDot0'), document.getElementById('mDot1'), document.getElementById('mDot2')];

function startMission() {
  missionQuestions = shuffle(missionBank).slice(0, MISSION_LEN);
  missionIndex = 0;
  document.getElementById('missionRocket').classList.remove('launch');
  document.getElementById('entryMission').classList.remove('unlocked');
  document.body.style.overflow = 'hidden';
  renderMission();
}

function renderMission() {
  missionDots.forEach((d, i) => {
    d.classList.toggle('done', i < missionIndex);
    d.classList.toggle('current', i === missionIndex);
  });
  missionMsgEl.textContent = '';
  missionMsgEl.className = 'mission-msg';
  const item = missionQuestions[missionIndex];
  missionQEl.textContent = item.q;
  missionOptsEl.innerHTML = '';
  item.options.forEach((optText, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = optText;
    btn.addEventListener('click', () => {
      if (i === item.a) {
        btn.classList.add('correct');
        missionOptsEl.querySelectorAll('.opt').forEach(b => b.disabled = true);
        missionMsgEl.textContent = 'Correct!';
        missionMsgEl.className = 'mission-msg correct';
        const rect = btn.getBoundingClientRect();
        confettiBurst(rect.left + rect.width / 2, rect.top);
        missionIndex++;
        setTimeout(() => {
          if (missionIndex >= MISSION_LEN) {
            missionDots.forEach(d => d.classList.add('done'));
            missionMsgEl.textContent = 'Launching... 🚀';
            document.getElementById('missionRocket').classList.add('launch');
            setTimeout(() => {
              document.getElementById('entryMission').classList.add('unlocked');
              document.body.style.overflow = '';
              startQuiz();
            }, 900);
          } else {
            renderMission();
          }
        }, 800);
      } else {
        btn.classList.add('wrong');
        btn.disabled = true;
        missionMsgEl.textContent = 'Not quite — try another answer!';
        missionMsgEl.className = 'mission-msg wrong';
      }
    });
    missionOptsEl.appendChild(btn);
  });
}

document.getElementById('replayBtn').addEventListener('click', startMission);
startMission();

// ---------- Science Questions quiz ----------
const scienceBank = [
  { topic: 'Space', q: 'How many planets are there in our solar system?', options: ['7', '8', '9', '10'], a: 1 },
  { topic: 'Space', q: 'Which planet is known as the Red Planet?', options: ['Venus', 'Mars', 'Jupiter', 'Saturn'], a: 1 },
  { topic: 'Space', q: 'Which planet is famous for its rings?', options: ['Saturn', 'Mercury', 'Earth', 'Mars'], a: 0 },
  { topic: 'Space', q: 'What is the closest star to Earth?', options: ['Proxima Centauri', 'Polaris', 'Sirius', 'The Sun'], a: 3 },
  { topic: 'Space', q: 'Which is the largest planet in our solar system?', options: ['Earth', 'Mars', 'Jupiter', 'Venus'], a: 2 },
  { topic: 'Body', q: 'How many bones does an adult human body have?', options: ['186', '206', '226', '246'], a: 1 },
  { topic: 'Body', q: 'Which part of the body pumps blood?', options: ['Lungs', 'Brain', 'Heart', 'Liver'], a: 2 },
  { topic: 'Body', q: 'How many chambers does the human heart have?', options: ['2', '3', '4', '5'], a: 2 },
  { topic: 'Body', q: 'Which sense organ helps us hear?', options: ['Eyes', 'Ears', 'Nose', 'Skin'], a: 1 },
  { topic: 'Body', q: 'Which organ do you use to see?', options: ['Ears', 'Eyes', 'Nose', 'Tongue'], a: 1 },
  { topic: 'Chemistry', q: 'What is the chemical symbol for water?', options: ['H2O', 'CO2', 'O2', 'NaCl'], a: 0 },
  { topic: 'Chemistry', q: 'What gas do humans breathe in to survive?', options: ['Carbon dioxide', 'Nitrogen', 'Oxygen', 'Helium'], a: 2 },
  { topic: 'Chemistry', q: 'What state of matter is ice?', options: ['Gas', 'Liquid', 'Solid', 'Plasma'], a: 2 },
  { topic: 'Chemistry', q: 'What is the boiling point of water in Celsius?', options: ['50', '90', '100', '150'], a: 2 },
  { topic: 'Chemistry', q: 'What is the center of an atom called?', options: ['Electron', 'Nucleus', 'Proton', 'Orbit'], a: 1 },
  { topic: 'Biology', q: 'What gas do plants absorb from the air to make food?', options: ['Oxygen', 'Carbon dioxide', 'Nitrogen', 'Hydrogen'], a: 1 },
  { topic: 'Biology', q: 'What do bees make?', options: ['Milk', 'Honey', 'Silk', 'Wax only'], a: 1 },
  { topic: 'Biology', q: 'What do caterpillars turn into?', options: ['Bees', 'Butterflies', 'Moths only', 'Beetles'], a: 1 },
  { topic: 'Biology', q: 'What do we call animals that only eat plants?', options: ['Carnivores', 'Omnivores', 'Herbivores', 'Predators'], a: 2 },
  { topic: 'Biology', q: 'What is the study of living things called?', options: ['Physics', 'Chemistry', 'Biology', 'Geology'], a: 2 },
  { topic: 'Physics', q: 'How many legs does a spider have?', options: ['6', '8', '10', '4'], a: 1 },
  { topic: 'Physics', q: 'What force pulls objects toward Earth?', options: ['Magnetism', 'Gravity', 'Friction', 'Tension'], a: 1 },
  { topic: 'Nature', q: 'Which bird cannot fly?', options: ['Sparrow', 'Ostrich', 'Eagle', 'Pigeon'], a: 1 },
  { topic: 'Nature', q: 'Which is the fastest land animal?', options: ['Lion', 'Horse', 'Cheetah', 'Leopard'], a: 2 },
];

const QUIZ_LEN = 10;
let qQuestions = [], qIndex = 0, qScore = 0;
const qQuestionEl = document.getElementById('qQuestion');
const qOptionsEl = document.getElementById('qOptions');
const qTopicEl = document.getElementById('qTopic');
const qNumEl = document.getElementById('qNum');
const qTotalEl = document.getElementById('qTotal');
const qScoreEl = document.getElementById('qScore');
const qBestEl = document.getElementById('qBest');
const qNextBtn = document.getElementById('qNext');
let qBest = Number(localStorage.getItem('dr_science_best') || 0);
qBestEl.textContent = qBest;
qTotalEl.textContent = QUIZ_LEN;

function startQuiz() {
  qQuestions = shuffle(scienceBank).slice(0, QUIZ_LEN);
  qIndex = 0;
  qScore = 0;
  qScoreEl.textContent = qScore;
  renderQuiz();
}

function renderQuiz() {
  if (qIndex >= qQuestions.length) {
    qTopicEl.textContent = 'Done';
    const pct = qScore / qQuestions.length;
    const starCount = pct >= 0.9 ? 3 : pct >= 0.6 ? 2 : 1;
    const stars = '⭐'.repeat(starCount) + '☆'.repeat(3 - starCount);
    qQuestionEl.innerHTML = `Quiz complete! 🎉<br>You scored <b>${qScore}/${qQuestions.length}</b>`;
    qOptionsEl.innerHTML = `<div class="star-rating">${stars}</div>`;
    if (qScore > qBest) {
      qBest = qScore;
      localStorage.setItem('dr_science_best', qBest);
      qBestEl.textContent = qBest;
    }
    qNextBtn.textContent = 'Play Again';
    qNextBtn.style.display = 'inline-block';
    qNextBtn.onclick = startQuiz;
    return;
  }
  const item = qQuestions[qIndex];
  qNumEl.textContent = qIndex + 1;
  qTopicEl.textContent = item.topic;
  qQuestionEl.textContent = item.q;
  qOptionsEl.innerHTML = '';
  qNextBtn.style.display = 'none';

  item.options.forEach((optText, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = optText;
    btn.addEventListener('click', () => selectQuiz(i, item));
    qOptionsEl.appendChild(btn);
  });
}

function selectQuiz(choice, item) {
  const btns = qOptionsEl.querySelectorAll('.opt');
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === item.a) b.classList.add('correct');
    else if (i === choice) b.classList.add('wrong');
  });
  if (choice === item.a) {
    qScore++;
    const rect = btns[choice].getBoundingClientRect();
    confettiBurst(rect.left + rect.width / 2, rect.top);
  }
  qScoreEl.textContent = qScore;
  qNextBtn.textContent = 'Next Question →';
  qNextBtn.style.display = 'inline-block';
  qNextBtn.onclick = () => { qIndex++; renderQuiz(); };
}
</script>
</body>
</html>
